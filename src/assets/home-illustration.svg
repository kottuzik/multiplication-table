<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" width="320" height="230">
  <!-- Home illustration for "Times Fun" – created for this project in the Style Guide manner -->
  <defs>
    <path id="star" d="M0,-38 L11.2,-15.4 L36.1,-11.7 L18.1,5.9 L22.3,30.7 L0,19 L-22.3,30.7 L-18.1,5.9 L-36.1,-11.7 L-11.2,-15.4 Z" />
  </defs>

  <!-- Soft yellow blob behind -->
  <ellipse cx="165" cy="118" rx="145" ry="98" fill="#FFF9D6" />
  <ellipse cx="230" cy="70" rx="70" ry="45" fill="#FDE74C" opacity="0.25" />

  <!-- Hand-drawn accent strokes -->
  <g stroke="#4A5B8F" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M268 24 L280 10" />
    <path d="M284 40 L300 33" />
    <path d="M290 58 L306 60" />
    <path d="M44 44 L34 30" />
    <path d="M30 62 L14 56" />
  </g>

  <!-- Board -->
  <g transform="translate(168 112) rotate(-9)">
    <rect x="-108" y="-64" width="216" height="128" rx="20" fill="#C9D8F5" stroke="#4A5B8F" stroke-width="4" />
    <rect x="-92" y="-49" width="184" height="98" rx="12" fill="#4A5B8F" />
    <rect x="-92" y="-49" width="184" height="98" rx="12" fill="none" stroke="#2D2D3A" stroke-opacity="0.25" stroke-width="2" />
    <text x="0" y="14" direction="ltr" text-anchor="middle"
          font-family="Rubik, 'Arial Rounded MT Bold', Arial, Helvetica, sans-serif"
          font-weight="700" font-size="40" fill="#FFF9D6">3 × 4 = ?</text>
  </g>

  <!-- Left smiling star -->
  <g transform="translate(50 172) rotate(-12) scale(1.05)">
    <use href="#star" fill="#FDE74C" stroke="#2D2D3A" stroke-width="3" stroke-linejoin="round" />
    <circle cx="-7" cy="-2" r="2.8" fill="#2D2D3A" />
    <circle cx="7" cy="-2" r="2.8" fill="#2D2D3A" />
    <circle cx="-12" cy="5" r="3" fill="#FF6B6B" opacity="0.35" />
    <circle cx="12" cy="5" r="3" fill="#FF6B6B" opacity="0.35" />
    <path d="M-6 6 Q0 12 6 6" fill="none" stroke="#2D2D3A" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Right smiling star -->
  <g transform="translate(276 180) rotate(10) scale(0.9)">
    <use href="#star" fill="#FDE74C" stroke="#2D2D3A" stroke-width="3" stroke-linejoin="round" />
    <circle cx="-7" cy="-2" r="2.8" fill="#2D2D3A" />
    <circle cx="7" cy="-2" r="2.8" fill="#2D2D3A" />
    <circle cx="-12" cy="5" r="3" fill="#FF6B6B" opacity="0.35" />
    <circle cx="12" cy="5" r="3" fill="#FF6B6B" opacity="0.35" />
    <path d="M-6 6 Q0 12 6 6" fill="none" stroke="#2D2D3A" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- Tiny accent star -->
  <g transform="translate(40 96) scale(0.3)">
    <use href="#star" fill="none" stroke="#4A5B8F" stroke-width="7" stroke-linejoin="round" />
  </g>
</svg>
